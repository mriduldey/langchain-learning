[project]
name = "langchain-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sudeshnadas96", email = "dassudeshna96@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.8",
    "langchain-anthropic>=1.7.9",
    "langchain-core>=1.7.5",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-learning = "langchain_learning:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
